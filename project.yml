name: MarkdownViewer

options:
  bundleIdPrefix: com.hazzahex
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  MarkdownRenderer:
    path: Packages/MarkdownRenderer

settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3Z822A3R56
    SWIFT_VERSION: "5.0"

targets:
  MarkdownViewer:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - path: SampleContent/kitchen-sink.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hazzahex.MarkdownViewer
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Markdown Viewer
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        # Expose the app's Documents in Files (On My iPhone) so we can drop a
        # .md in and verify the Thumbnail extension renders its grid icon.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Register the app as a Viewer of markdown so it appears in "Open With".
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - net.daringfireball.markdown
        # Import (do not own) the de-facto markdown UTI, conforming to plain-text.
        # NOTE (Spike 0 finding): on iOS this means the Files PREVIEW pane always
        # uses the built-in text viewer and never our QL preview extension — that
        # is an unavoidable iOS rule for text-conforming types. The native-feel
        # path on iOS is the Thumbnail extension + the in-app reader instead.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
                - mdown
                - mkd
                - mdwn
                - mmd
              public.mime-type:
                - text/markdown
                - text/x-markdown
    dependencies:
      - package: MarkdownRenderer
        product: MarkdownRenderer
      - target: QuickLookThumbnail

  QuickLookThumbnail:
    type: app-extension
    platform: iOS
    sources:
      - Extensions/QuickLookThumbnail
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hazzahex.MarkdownViewer.QuickLookThumbnail
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Extensions/QuickLookThumbnail/Info.plist
      properties:
        CFBundleDisplayName: Markdown Thumbnail
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - net.daringfireball.markdown

  # ---- macOS ----
  MarkdownViewer-mac:
    type: application
    platform: macOS
    sources:
      - App/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hazzahex.MarkdownViewer
        PRODUCT_NAME: MarkdownViewer
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: App/Info-macOS.plist
      properties:
        CFBundleDisplayName: Markdown Viewer
        LSMinimumSystemVersion: "15.0"
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - net.daringfireball.markdown
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkd, mdwn, mmd]
              public.mime-type: [text/markdown, text/x-markdown]
    entitlements:
      path: App/MarkdownViewer-mac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.network.client: true  # load remote images in markdown
    dependencies:
      - package: MarkdownRenderer
        product: MarkdownRenderer
      - target: QuickLookPreviewMac
      - target: QuickLookThumbnailMac

  QuickLookThumbnailMac:
    type: app-extension
    platform: macOS
    sources:
      - Extensions/QuickLookThumbnailMac
      - Extensions/QuickLookThumbnail/ThumbnailModel.swift  # shared parser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hazzahex.MarkdownViewer.QuickLookThumbnailMac
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Extensions/QuickLookThumbnailMac/Info.plist
      properties:
        CFBundleDisplayName: Markdown Thumbnail
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - net.daringfireball.markdown
    entitlements:
      path: Extensions/QuickLookThumbnailMac/QuickLookThumbnailMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true

  QuickLookPreviewMac:
    type: app-extension
    platform: macOS
    sources:
      - Extensions/QuickLookPreviewMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hazzahex.MarkdownViewer.QuickLookPreviewMac
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Extensions/QuickLookPreviewMac/Info.plist
      properties:
        CFBundleDisplayName: Markdown Preview
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - net.daringfireball.markdown
            QLSupportsSearchableItems: false
    entitlements:
      path: Extensions/QuickLookPreviewMac/QuickLookPreviewMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.network.client: true  # load remote images in previews
    dependencies:
      - package: MarkdownRenderer
        product: MarkdownRenderer

schemes:
  MarkdownViewer:
    build:
      targets:
        MarkdownViewer: all
    run:
      config: Debug
    archive:
      config: Release
  MarkdownViewer-mac:
    build:
      targets:
        MarkdownViewer-mac: all
    run:
      config: Debug
    archive:
      config: Release
